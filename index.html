<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Camp</title>
  <meta name="description" content="Quiz and study guide for UGC NET English and GATE XH-C2 English">
  <meta name="theme-color" content="#f6eef8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Camp">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>.tabs { grid-template-columns: repeat(6, 1fr); padding-left: 6px; padding-right: 6px; } .tabs button { font-size: 11px; padding: 0 2px; min-width: 0; }</style>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('litquiz-theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <button class="brand" data-act="tab" data-tab="home" aria-label="Home">
        <span class="title">Camp</span>
        <span class="subtitle">UGC NET · GATE English</span>
      </button>
      <button class="icon-btn theme-btn" id="theme-btn" data-act="toggleTheme" aria-label="Toggle night mode"></button>
    </header>

    <main id="view" aria-live="polite"></main>
  </div>

  <nav class="tabs" id="tabs" aria-label="Main">
    <button data-act="tab" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/></svg>
      <span>Quiz</span>
    </button>
    <button data-act="tab" data-tab="guide">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C10 5 7 4.5 4 5v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V5c-3-.5-6 0-8 1.5zm0 0V19"/></svg>
      <span>Guide</span>
    </button>
    <button data-act="tab" data-tab="syllabus">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5h10M9 12h10M9 17.5h10M4.5 6.5l1 1 2-2M4.5 12l1 1 2-2M4.5 17.5h2"/></svg>
      <span>Syllabus</span>
    </button>
    <button data-act="tab" data-tab="plan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6.5h14a1 1 0 0 1 1 1V19a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7.5a1 1 0 0 1 1-1zM4 10.5h16M8.5 4v4M15.5 4v4M8 14.5l2 2 4-4"/></svg>
      <span>Plan</span>
    </button>
    <button data-act="tab" data-tab="stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>
      <span>Stats</span>
    </button>
    <button data-act="tab" data-tab="more">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18.5" cy="12" r="1.3"/></svg>
      <span>More</span>
    </button>
  </nav>

  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <!-- Change the number after ?v= whenever app.js changes, so phones load the matching version -->
  <script src="app.js?v=10"></script>
</body>
</html>
